[package]
name = "openclaw-launcher"
version = "1.0.0"
edition = "2021"
description = "OpenClaw Launcher — One-click install, launch, uninstall"

[lib]
name = "openclaw_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros"] }
open = "5"
