<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Launcher</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    #app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: linear-gradient(135deg, #0d1117, #161b22);
    }
    .titlebar {
      padding: 10px 14px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }
    .brand { font-weight: 700; color: #58a6ff; }
    .layout { min-height: 0; display: grid; grid-template-columns: 190px 1fr; }
    .sidebar {
      padding: 16px;
      border-right: 1px solid #30363d;
      background: rgba(22, 27, 34, .8);
    }
    .tab {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: #8b949e;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active, .tab:hover { color: #e6edf3; background: #21262d; border-color: #30363d; }
    .content {
      min-height: 0;
      overflow: hidden;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }
    .app-busy .sidebar,
    .app-busy .content {
      pointer-events: none;
      opacity: .72;
    }
    .panel { display: none; min-height: 0; }
    .panel.active { display: grid; gap: 14px; grid-template-rows: auto 1fr; }
    #panel-agents.active { grid-template-rows: auto minmax(120px, 1fr) auto; }
    .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .card {
      padding: 14px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
    }
    .label {
      margin-bottom: 6px;
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .value { font-size: 14px; font-weight: 700; }
    .ok { color: #3fb950; }
    .warn { color: #d29922; }
    .no { color: #f85149; }
    .actions, .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      min-width: 72px;
      padding: 8px 11px;
      border: 1px solid #30363d;
      border-radius: 9px;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: #58a6ff; background: #30363d; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.busy::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 999px;
      vertical-align: -1px;
      animation: spin .8s linear infinite;
    }
    .primary { background: #1f6feb; border-color: #1f6feb; }
    .danger { color: #f85149; border-color: #da3633; }
    .danger:hover:not(:disabled) { background: #da3633; color: #fff; }
    input:not([type="checkbox"]), textarea, select {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #0d1117;
      color: #e6edf3;
      outline: none;
    }
    input:not([type="checkbox"]):focus, textarea:focus, select:focus { border-color: #58a6ff; }
    select { color-scheme: dark; cursor: pointer; }
    .checkbox-label { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; color: #c9d1d9; font-size: 12px; white-space: nowrap; }
    .checkbox-label input { width: 16px; height: 16px; margin: 0; accent-color: #58a6ff; }
    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      font: 12px/1.5 "Cascadia Code", Consolas, monospace;
    }
    pre, .log-area {
      min-height: 0;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #0d1117;
      color: #c9d1d9;
      font: 12px/1.55 "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
    }
    .log-line { margin-bottom: 2px; }
    .time { margin-right: 8px; color: #6e7681; }
    .progress { height: 4px; overflow: hidden; border-radius: 999px; background: #21262d; }
    .progress > div { width: 0; height: 100%; background: #58a6ff; transition: width .2s ease; }
    .provider-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    .provider-card { min-height: 104px; padding: 10px; border: 1px solid #30363d; border-radius: 7px; background: #161b22; color: #c9d1d9; text-align: left; cursor: pointer; }
    .provider-card:hover, .provider-card.selected { border-color: #58a6ff; background: #1c2735; }
    .provider-card.active { box-shadow: inset 3px 0 #3fb950; }
    .agent-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; align-content: start; overflow: auto; }
    .agent-card { min-height: 96px; padding: 11px; border: 1px solid #30363d; border-radius: 7px; background: #161b22; color: #c9d1d9; text-align: left; cursor: pointer; }
    .agent-card:hover, .agent-card.selected { border-color: #58a6ff; background: #1c2735; }
    .agent-card strong { display: block; color: #f0f6fc; font-size: 14px; }
    .agent-card span { display: block; margin-top: 5px; overflow: hidden; color: #8b949e; font: 11px/1.35 "Cascadia Code", Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .agent-card em { display: inline-block; margin-top: 7px; padding: 2px 5px; border: 1px solid #3fb950; border-radius: 4px; color: #3fb950; font-size: 10px; font-style: normal; }
    .provider-card-title { font-weight: 700; color: #f0f6fc; }
    .provider-card-meta { margin-top: 6px; color: #8b949e; font: 11px/1.45 "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .model-picker { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; padding: 8px 0; }
    .model-chip { padding: 5px 8px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #c9d1d9; font: 11px "Cascadia Code", Consolas, monospace; cursor: pointer; }
    .model-chip:hover, .model-chip.selected { border-color: #58a6ff; background: #1c2735; color: #f0f6fc; }
    .skill-layout { min-height: 0; display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 12px; }
    .skill-list { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 8px; }
    .skill-card { width: 100%; min-height: 86px; padding: 11px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; color: #c9d1d9; text-align: left; cursor: pointer; }
    .skill-card:hover, .skill-card.selected { border-color: #58a6ff; background: #1c2735; }
    .skill-card.disabled { opacity: .62; }
    .skill-card-title { display: flex; justify-content: space-between; gap: 8px; color: #f0f6fc; font-weight: 700; }
    .skill-card-desc { margin-top: 6px; color: #8b949e; font-size: 11px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .skill-card-meta { margin-top: 7px; color: #8b949e; font: 11px "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .skill-pill { flex: 0 0 auto; padding: 2px 6px; border: 1px solid #30363d; border-radius: 999px; color: #8b949e; font-size: 10px; font-weight: 700; }
    .skill-pill.ready { color: #3fb950; border-color: #2ea043; }
    .skill-pill.local { color: #d29922; border-color: #bb8009; }
    .skill-editor { min-height: 0; display: grid; grid-template-rows: auto minmax(160px, 1fr); gap: 10px; }
    .task-layout { min-height: 0; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 12px; }
    .task-list { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 8px; }
    .task-card { width: 100%; padding: 11px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; color: #c9d1d9; text-align: left; cursor: pointer; }
    .task-card:hover, .task-card.selected { border-color: #58a6ff; background: #1c2735; }
    .task-card.disabled { opacity: .62; }
    .task-card-title { display: flex; justify-content: space-between; gap: 8px; color: #f0f6fc; font-weight: 700; }
    .task-card-meta { margin-top: 6px; color: #8b949e; font: 11px/1.45 "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .task-pill { flex: 0 0 auto; padding: 2px 6px; border: 1px solid #30363d; border-radius: 999px; color: #8b949e; font-size: 10px; font-weight: 700; }
    .task-pill.on { color: #3fb950; border-color: #2ea043; }
    .task-editor { min-height: 0; display: grid; grid-template-rows: auto auto minmax(120px, 1fr); gap: 10px; }
    .task-editor textarea { min-height: 120px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="titlebar">
      <div class="brand">OpenClaw Launcher</div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <button class="tab active" data-tab="launcher">启动器</button>
        <button class="tab" data-tab="providers">供应商</button>
        <button class="tab" data-tab="agents">Agents 管理</button>
        <button class="tab" data-tab="skills">Skills 管理</button>
        <button class="tab" data-tab="tasks">定时任务</button>
        <button class="tab" data-tab="logs">日志</button>
      </aside>

      <main class="content">
        <section class="panel active" id="panel-launcher">
          <div>
            <div class="status-grid">
              <div class="card"><div class="label">Node.js</div><div class="value" id="st-node">检测中...</div></div>
              <div class="card"><div class="label">npm</div><div class="value" id="st-npm">检测中...</div></div>
              <div class="card"><div class="label">OpenClaw</div><div class="value" id="st-oc">检测中...</div></div>
              <div class="card"><div class="label">Gateway</div><div class="value" id="st-gw">检测中...</div></div>
            </div>
            <div class="progress" style="margin-top:12px"><div id="progress-fill"></div></div>
          </div>
          <div class="card">
            <div class="actions">
              <button class="btn primary" id="btn-launch" disabled>重启 Gateway</button>
              <button class="btn danger" id="btn-stop-openclaw" disabled>停止 OpenClaw</button>
              <button class="btn" id="btn-refresh-status">刷新状态</button>
              <button class="btn" id="btn-doctor-fix">一键修复</button>
              <button class="btn" id="btn-dashboard">打开界面</button>
              <button class="btn" id="btn-check-update">检查更新</button>
              <button class="btn" id="btn-install-node" disabled>安装 Node.js</button>
              <button class="btn" id="btn-install-oc" disabled>安装 OpenClaw</button>
              <button class="btn danger" id="btn-uninstall" disabled>卸载 OpenClaw</button>
            </div>
          </div>
        </section>

        <section class="panel" id="panel-providers">
          <div class="toolbar">
            <button class="btn primary" id="btn-providers-refresh">刷新供应商</button>
            <button class="btn" id="btn-providers-import">从 ccswitch 导入</button>
            <button class="btn" id="btn-provider-new">新建</button>
            <button class="btn" id="btn-provider-fetch-models">获取模型</button>
            <button class="btn" id="btn-provider-save">保存/联动</button>
            <button class="btn" id="btn-provider-activate">启用</button>
            <button class="btn danger" id="btn-provider-delete">删除</button>
          </div>
          <div class="toolbar">
            <input id="provider-id" placeholder="供应商 ID，例如 deepseek / openai" />
            <input id="provider-base-url" placeholder="Base URL，例如 https://api.openai.com/v1" />
            <input id="provider-api-key" placeholder="API Key" />
            <select id="provider-api" aria-label="API 类型">
              <option value="openai-completions">OpenAI Completions</option>
              <option value="openai-responses">OpenAI Responses</option>
              <option value="anthropic-messages">Anthropic Messages</option>
              <option value="google-generative-ai">Google Generative AI</option>
              <option value="bedrock-converse-stream">AWS Bedrock</option>
            </select>
            <label class="checkbox-label"><input id="provider-use-full-path" type="checkbox" /> 使用完整接口路径</label>
          </div>
          <textarea id="provider-models" placeholder="模型列表，每行一个：模型ID 或 模型ID | 显示名"></textarea>
          <div class="model-picker" id="provider-model-picker"></div>
          <div class="provider-list" id="provider-list"></div>
          <pre id="providers-output">点击“刷新供应商”查看 OpenClaw 当前供应商。保存会写入 ~/.openclaw/openclaw.json 并同步 Agents 默认模型。</pre>
        </section>

        <section class="panel" id="panel-agents">
          <div class="toolbar">
            <button class="btn primary" id="btn-agents-refresh">刷新 Agents</button>
            <input id="agent-name" placeholder="新 Agent 名称，例如 research" />
            <button class="btn" id="btn-agent-add">添加</button>
            <button class="btn danger" id="btn-agent-delete">删除</button>
          </div>
          <div class="agent-list" id="agent-list"></div>
          <pre id="agents-output">点击“刷新 Agents”查看当前配置。</pre>
        </section>

        <section class="panel" id="panel-skills">
          <div class="toolbar">
            <button class="btn primary" id="btn-skills-refresh">刷新 Skills</button>
            <input id="skill-query" placeholder="Skill 名称或搜索词" />
            <button class="btn" id="btn-skill-info">详情</button>
            <button class="btn" id="btn-skill-search">搜索</button>
            <button class="btn" id="btn-skill-install">安装</button>
            <button class="btn danger" id="btn-skill-remove">移除</button>
          </div>
          <div class="skill-layout">
            <div class="skill-list" id="skill-list"></div>
            <div class="skill-editor">
              <div class="toolbar">
                <input id="skill-selected" placeholder="选中 Skill 后自动填入" readonly />
                <button class="btn" id="btn-skill-clear">清空选择</button>
              </div>
              <pre id="skills-output">点击“刷新 Skills”查看可用技能。选中左侧 Skill 后可以查看详情或移除非内置 Skill。</pre>
            </div>
          </div>
        </section>

        <section class="panel" id="panel-tasks">
          <div class="toolbar">
            <button class="btn primary" id="btn-tasks-refresh">刷新任务</button>
            <button class="btn" id="btn-tasks-status">调度状态</button>
            <button class="btn" id="btn-task-new">新建</button>
            <button class="btn" id="btn-task-run">立即运行</button>
            <button class="btn danger" id="btn-task-delete">移除任务</button>
          </div>
          <div class="task-layout">
            <div class="task-list" id="task-list"></div>
            <div class="task-editor">
              <div class="toolbar">
                <input id="task-id" placeholder="选中任务后自动填入 ID" readonly />
                <input id="task-name" placeholder="任务名称，例如 daily-summary" />
              </div>
              <div class="toolbar">
                <select id="task-schedule-kind" aria-label="调度类型">
                  <option value="every">间隔</option>
                  <option value="cron">Cron</option>
                  <option value="at">一次性</option>
                </select>
                <input id="task-schedule-value" placeholder="1h / 30m，或 Cron 表达式" />
                <input id="task-description" placeholder="备注（可选）" />
                <button class="btn" id="btn-task-save">保存编辑</button>
              </div>
              <textarea id="task-message" placeholder="任务内容，例如 总结今天的状态"></textarea>
              <pre id="tasks-output">点击“刷新任务”查看当前定时任务。选中左侧任务后可以编辑或移除。</pre>
            </div>
          </div>
        </section>

        <section class="panel" id="panel-logs">
          <div class="toolbar">
            <button class="btn" id="btn-clear-log">清空日志</button>
          </div>
          <div class="log-area" id="log-area">等待操作...</div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
